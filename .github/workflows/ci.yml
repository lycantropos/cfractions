name: CI

on:
  push:
    branches:
      - 'master'
    tags: [ 'v*' ]
  pull_request:
    branches:
      - 'master'

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Setup Python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: 'Check Python metadata'
        run: |
          PROJECT_DESCRIPTION=$(python -c 'import json, pathlib, tomllib; print(json.dumps(tomllib.loads(pathlib.Path("pyproject.toml").read_text())))' | jq --raw-output '.project.description')
          MODULE_DOCSTRING=$(python -c "import ${REPOSITORY_NAME//-/_} as module; assert module.__doc__ is not None; print(module.__doc__)")
          if [[ $PROJECT_DESCRIPTION != "$MODULE_DOCSTRING" ]]; then
            echo "Project description should be equal to module docstring, but found \"$PROJECT_DESCRIPTION\" != \"$MODULE_DOCSTRING\".";
            exit 1;
          fi
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
      - name: 'Install pre-commit'
        run: python -m pip install -U pre-commit
      - name: 'Run pre-commit'
        run: pre-commit run --all-files --hook-stage manual

  test:
    name: 'Test'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python_version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        platform: [
          { os: 'macos-latest', python_architecture: 'x64', coverage: 'llvm' },
          { os: 'ubuntu-latest', python_architecture: 'x64', coverage: 'gcovr' },
          { os: 'windows-latest', python_architecture: 'x64' },
          { os: 'windows-latest', python_architecture: 'x86' },
        ]
        exclude:
          - python_version: '3.10'
            platform: { os: 'macos-latest', python_architecture: 'x64', coverage: 'llvm' }
        include:
          - python_version: 'pypy-3.11'
            platform: { os: 'macos-latest', python_architecture: 'x64' }
          - python_version: 'pypy-3.11'
            platform: { os: 'ubuntu-latest', python_architecture: 'x64' }
          - python_version: 'pypy-3.11'
            platform: { os: 'windows-latest', python_architecture: 'x64' }
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Setup Python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.platform.python_architecture }}
      - name: 'Install packaging tools'
        run: python -m pip install -U pip setuptools wheel
      - name: 'Install Python coverage dependencies'
        run: python -m pip install -U coverage[toml]
      - name: 'Install LLVM on macOS'
        if: ${{ matrix.platform.coverage == 'llvm' && startsWith(matrix.platform.os, 'macos-') }}
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: 'Install gcovr'
        if: ${{ matrix.platform.coverage == 'gcovr' }}
        run: pip install gcovr
      - name: 'Install lcov-cobertura'
        if: ${{ matrix.platform.coverage == 'llvm' }}
        run: pip install lcov-cobertura
      - name: 'Install in editable mode with GCC'
        run: |
          python -m pip -v install -e '.[tests]'
          python -m pip install tomli
          python -c 'import tomli; import pathlib; print(*tomli.loads(pathlib.Path('\''pyproject.toml'\'').read_text(encoding='\''utf-8'\''))['\''build-system'\'']['\''requires'\''])' | xargs python -m pip install
          python setup.py build_ext --inplace --force
          find . -name '*.gcno'
        if: ${{ matrix.platform.coverage == 'gcovr' }}
        env:
          CFLAGS: --coverage -O0 -g
      - name: 'Install in editable mode with LLVM'
        run: ARCHFLAGS="-arch $(uname -m)" python -m pip -v install -e '.[tests]'
        if: ${{ matrix.platform.coverage == 'llvm' }}
        env:
          CFLAGS: -fprofile-instr-generate -fcoverage-mapping -O0 -g
          LDFLAGS: -fprofile-instr-generate
      - name: 'Install in editable mode'
        run: python -m pip -v install -e '.[tests]'
        if: ${{ matrix.platform.coverage == null }}
      - name: 'Run doctests'
        run: |
          coverage run -m doctest README.md
          coverage run --append -m pytest --doctest-modules --ignore=tests
        env:
          LLVM_PROFILE_FILE: coverage_doctest_%p.profraw
      - name: 'Run tests'
        run: coverage run --append -m pytest
        env:
          LLVM_PROFILE_FILE: coverage_pytest_%p.profraw
      - name: 'Collect Python coverage'
        run: coverage xml -o coverage_python.xml
      - name: 'Collect C coverage using gcovr'
        if: ${{ matrix.platform.coverage == 'gcovr' }}
        run: >
          gcovr \
            -r . \
            --filter '^src/' \
            --xml \
            -o coverage_c.xml
      - name: 'Collect C coverage using llvm-cov'
        if: ${{ matrix.platform.coverage == 'llvm' }}
        run: |
          llvm-profdata merge \
            -sparse \
            coverage_*.profraw \
            -o coverage.profdata


          libs=()
          while IFS= read -r -d '' file; do
              libs+=("$file")
          done < <(find "${REPOSITORY_NAME//-/_}" \( -name '*.so' -o -name '*.pyd' \) -print0)
          args=("${libs[0]}")
          for lib in "${libs[@]:1}"; do
              args+=(-object "$lib")
          done

          llvm-cov export \
            "${args[@]}" \
            -instr-profile=coverage.profdata \
            -format=lcov \
            -ignore-filename-regex='^(?!.*\/src\/).*' \
            > coverage.lcov

          lcov_cobertura coverage.lcov --output coverage_c.xml
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
      - name: 'Upload PyPy coverage'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: ./coverage_python.xml
          token: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ startsWith(matrix.python_version, 'pypy') }}
        continue-on-error: true
      - name: 'Upload СPython coverage'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: ./coverage_python.xml,./coverage_c.xml
          token: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ !startsWith(matrix.python_version, 'pypy') }}
        continue-on-error: true

  pre-deploy:
    name: 'Pre-deploy'
    runs-on: ubuntu-latest
    needs: test
    if:
      github.event_name == 'push' && github.ref_type == 'tag'
      || github.actor == 'dependabot[bot]'
    steps:
      - name: '_'
        run: echo "Pre-deploy step"

  build-sdist:
    name: 'Build sdist'
    runs-on: ubuntu-latest
    needs: pre-deploy
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Setup Python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: 'Install packaging tools'
        run: python -m pip install -U build
      - name: 'Build sdist'
        run: python -m build --sdist
      - name: 'Upload sdist'
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist

  build-wheels:
    name: 'Build wheels'
    runs-on: ${{ matrix.platform.os }}
    needs: pre-deploy
    strategy:
      fail-fast: false
      matrix:
        python_tag: [ 'cp310', 'cp311', 'cp312', 'cp313', 'cp314' ]
        platform: [
          {
            architecture: 'arm64',
            os: 'macos-latest',
            python_architecture: 'x64',
            tag: 'macosx_arm64'
          },
          {
            architecture: 'x86_64',
            os: 'macos-latest',
            python_architecture: 'x64',
            tag: 'macosx_x86_64'
          },
          {
            architecture: 'aarch64',
            os: 'ubuntu-latest',
            python_architecture: 'x64',
            tag: 'manylinux_aarch64'
          },
          {
            architecture: 'aarch64',
            os: 'ubuntu-latest',
            python_architecture: 'x64',
            tag: 'musllinux_aarch64'
          },
          {
            architecture: 'i686',
            os: 'ubuntu-latest',
            python_architecture: 'x64',
            tag: 'manylinux_i686'
          },
          {
            architecture: 'ppc64le',
            os: 'ubuntu-latest',
            python_architecture: 'x64',
            tag: 'manylinux_ppc64le'
          },
          {
            architecture: 's390x',
            os: 'ubuntu-latest',
            python_architecture: 'x64',
            tag: 'manylinux_s390x'
          },
          {
            architecture: 'x86_64',
            os: 'ubuntu-latest',
            python_architecture: 'x64',
            tag: 'manylinux_x86_64'
          },
          {
            architecture: 'x86_64',
            os: 'ubuntu-latest',
            python_architecture: 'x64',
            tag: 'musllinux_x86_64'
          },
          {
            architecture: 'AMD64',
            os: 'windows-latest',
            python_architecture: 'x64',
            tag: 'win_amd64'
          },
          {
            architecture: 'x86',
            os: 'windows-latest',
            python_architecture: 'x86',
            tag: 'win32'
          },
        ]
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Setup Python'
        uses: actions/setup-python@v7
        with:
          architecture: ${{ matrix.platform.python_architecture }}
      - name: 'Setup QEMU'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
        if: ${{ runner.os == 'Linux' }}
      - name: 'Build wheels'
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.platform.architecture }}
          CIBW_BUILD: ${{ matrix.python_tag }}-${{ matrix.platform.tag }}
          CIBW_BUILD_VERBOSITY: 1
      - name: 'Upload wheels'
        uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.python_tag }}-${{ matrix.platform.tag }}
          path: wheelhouse/*.whl

  test-distributions:
    name: 'Test distributions'
    runs-on: ${{ matrix.platform.os }}
    needs: [ build-sdist, build-wheels ]
    strategy:
      matrix:
        python_version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        platform: [
          { os: 'macos-latest', python_architecture: 'x64' },
          { os: 'ubuntu-latest', python_architecture: 'x64' },
          { os: 'windows-latest', python_architecture: 'x64' },
          { os: 'windows-latest', python_architecture: 'x86' },
        ]
        exclude:
          - python_version: '3.10'
            platform: { os: 'macos-latest', python_architecture: 'x64' }
        include:
          - python_version: 'pypy-3.10'
            platform: { os: 'ubuntu-latest', python_architecture: 'x64' }
          - python_version: 'pypy-3.10'
            platform: { os: 'windows-latest', python_architecture: 'x64' }
          - python_version: 'pypy-3.11'
            platform: { os: 'macos-latest', python_architecture: 'x64' }
          - python_version: 'pypy-3.11'
            platform: { os: 'ubuntu-latest', python_architecture: 'x64' }
          - python_version: 'pypy-3.11'
            platform: { os: 'windows-latest', python_architecture: 'x64' }
    steps:
      - name: 'Setup Python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.platform.python_architecture }}
      - name: 'Download distributions'
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
          pattern: dist-*
      - name: 'Install from distributions'
        run: >
          python -m pip install --find-links=dist --no-deps
          "${REPOSITORY_NAME//-/_}"
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}

  deploy-pypi:
    name: 'Deploy to PyPI'
    environment: release
    needs: test-distributions
    runs-on: ubuntu-latest
    steps:
      - name: 'Download distributions'
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
          pattern: dist-*
      - name: 'Upload to Test PyPI'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: ${{ github.actor == 'dependabot[bot]' }}
        continue-on-error: true
      - name: 'Upload to PyPI'
        if: github.actor != 'dependabot[bot]'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
